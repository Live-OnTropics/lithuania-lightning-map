<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <title>Europe Lightning Map (Last Hour)⚡</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Turf.js for Nowcasting -->
    <script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #map { height: 100%; width: 100%; z-index: 1; }
        .info-panel { background: rgba(255, 255, 255, 0.85); padding: 5px 10px; border-radius: 5px; box-shadow: 0 1px 5px rgba(0,0,0,0.2); position: absolute; top: 10px; left: 50px; z-index: 1000; font-size: 0.8em; }
        .legend { background: rgba(255,255,255,0.85); padding: 8px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,0.2); position: absolute; bottom: 30px; right: 10px; z-index: 1000; font-size: 0.75em; max-width: 180px; }
        .legend h4 { margin: 0 0 6px; font-weight: 600; font-size: 0.85em; }
        .legend div { display: flex; align-items: center; margin-bottom: 3px; }
        .color-box { width: 14px; height: 14px; margin-right: 6px; border-radius: 3px; border: 1px solid #ccc; }
        /* Nowcast Styles */
        .nowcast-cluster { /* Style via JS options */ }
        .nowcast-cone { /* Style via JS options */ }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <div id="status">Loading...</div>
        <div id="last-updated"></div>
    </div>
    <div id="legend" class="legend" style="display: none;"></div>

    <script>
        // --- Configuration ---
        const MAP_CENTER = [50.0, 15.0];
        const MAP_ZOOM = 4;
        const DATA_URL = "strikes_europe.json";
        const REFRESH_INTERVAL_MS = 20 * 1000;
        const STRIKE_MAX_AGE_MS = 60 * 60 * 1000;

        const NOWCAST_CONF = {
            MAX_CLUSTER_DIST_KM: 50, MIN_CLUSTER_SIZE: 3, MAX_TIME_RANGE_MS: 1 * 3600 * 1000,
            TIME_BIN_MS: 5 * 60 * 1000, INACTIVITY_THRESHOLD_MS: 15 * 60 * 1000,
            DECAY_CONSTANT: 2, RANSAC_ITERATIONS: 100, RANSAC_THRESHOLD_DEG: 0.1,
            MIN_BINS_FOR_MOTION: 2, SMOOTHING_NEIGHBOR_DIST_KM: 0
        };

        // --- Map Initialization ---
        const map = L.map('map').setView(MAP_CENTER, MAP_ZOOM);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Lightning data © <a href="https://www.blitzortung.org/">Blitzortung.org</a>'
        }).addTo(map);

        // Layer groups
        const strikeLayer = L.layerGroup().addTo(map);
        const nowcastLayer = L.layerGroup().addTo(map); // Keep nowcast separate, easier to clear/redraw

        // Status elements
        const statusElement = document.getElementById('status');
        const lastUpdatedElement = document.getElementById('last-updated');
        const legendElement = document.getElementById('legend');

        let strikeDataCache = [];
        // --- NEW: Store currently displayed markers ---
        let currentMarkers = {}; // Use an object (like a dictionary/map) { strikeId: markerObject }

        // --- Helper: Create a unique ID for each strike ---
        function getStrikeId(strike) {
            // Combine time, lat, lon for a unique ID. Robustness depends on data precision.
            // Using strings is generally safer for object keys.
            return `${strike.time}_${strike.lat.toFixed(5)}_${strike.lon.toFixed(5)}`;
        }

        // --- Data Fetching (no changes needed here) ---
        async function fetchDataAndUpdateMap() {
            // ... (fetch logic remains the same) ...
             statusElement.textContent = "Fetching data...";
            try {
                const response = await fetch(`${DATA_URL}?t=${Date.now()}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const fetchedData = await response.json();
                if (!Array.isArray(fetchedData)) {
                     throw new Error("Fetched data is not an array.");
                }
                strikeDataCache = fetchedData;
                statusElement.textContent = "Processing data...";
                updateMapDisplay(); // Process using the new cache
                lastUpdatedElement.textContent = `Map updated: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error("Error fetching or processing data:", error);
                statusElement.textContent = `Error loading data: ${error.message}. Using cached data if available.`;
                updateMapDisplay(); // Try update with old cache
            }
        }

        // --- Map Display Update (MODIFIED) ---
        function updateMapDisplay() {
            const now = Date.now();
            const cutoffTime = now - STRIKE_MAX_AGE_MS;
            let lastStrikeTime = 0;
            let displayedStrikeCount = 0;

            // --- 1. Filter strikes and create a Set of current strike IDs ---
            const validStrikesById = {}; // Temporary map { strikeId: strikeData }
            const currentStrikeIds = new Set(); // Set of IDs for strikes to be displayed now

            strikeDataCache.forEach(s => {
                 if (!s || typeof s.time !== 'string' || typeof s.lat !== 'number' || typeof s.lon !== 'number') {
                    return; // Skip malformed
                 }
                 try {
                     const strikeTime = parseISOTime(s.time).getTime();
                     if (!isNaN(strikeTime) && strikeTime >= cutoffTime) {
                          if (strikeTime > lastStrikeTime) lastStrikeTime = strikeTime;
                          const strikeId = getStrikeId(s);
                          validStrikesById[strikeId] = s; // Store strike data by ID
                          currentStrikeIds.add(strikeId); // Add ID to the set of strikes that should be visible
                          return true;
                     }
                     return false;
                 } catch (e) {
                    return false;
                 }
             });

            // --- 2. Remove markers that are no longer valid (too old) ---
            const markerIdsToRemove = [];
            for (const existingId in currentMarkers) {
                if (!currentStrikeIds.has(existingId)) {
                    // This marker's ID is not in the set of currently valid strikes
                    strikeLayer.removeLayer(currentMarkers[existingId]); // Remove from map layer
                    markerIdsToRemove.push(existingId); // Mark for deletion from our tracking object
                }
            }
            // Clean up the tracking object
            markerIdsToRemove.forEach(id => delete currentMarkers[id]);

            // --- 3. Add new markers OR update existing ones ---
            currentStrikeIds.forEach(strikeId => {
                const strike = validStrikesById[strikeId]; // Get the strike data
                const strikeTime = parseISOTime(strike.time).getTime();
                const ageMillis = now - strikeTime;
                const ageFraction = Math.min(1, Math.max(0, ageMillis / STRIKE_MAX_AGE_MS));
                const color = getColorFromAge(ageFraction);

                if (currentMarkers[strikeId]) {
                    // --- Marker already exists: Update its style ---
                    const existingMarker = currentMarkers[strikeId];
                    existingMarker.setStyle({
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.8,
                        weight: 1 // Ensure weight is reset if needed
                    });
                    // Optional: Update popup content if needed, but usually not necessary unless data changes
                    // existingMarker.setPopupContent(`Time: ${new Date(strikeTime).toLocaleString()}<br>Coords: ${strike.lat.toFixed(4)}, ${strike.lon.toFixed(4)}`);
                } else {
                    // --- Marker is new: Create and add it ---
                    const newMarker = L.circleMarker([strike.lat, strike.lon], {
                        radius: 4,
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.8,
                        weight: 1
                    }).bindPopup(`Time: ${new Date(strikeTime).toLocaleString()}<br>Coords: ${strike.lat.toFixed(4)}, ${strike.lon.toFixed(4)}`);

                    newMarker.addTo(strikeLayer); // Add to the map layer
                    currentMarkers[strikeId] = newMarker; // Add to our tracking object
                }
            });

            displayedStrikeCount = Object.keys(currentMarkers).length; // Count tracked markers

            // Update Status Text
             statusElement.textContent = `Displaying ${displayedStrikeCount} strikes (last hour)`;
             if (lastStrikeTime > 0) {
                 statusElement.textContent += ` | Latest: ${new Date(lastStrikeTime).toLocaleTimeString()}`;
             } else if (strikeDataCache.length > 0 && displayedStrikeCount === 0) {
                 statusElement.textContent += ` | No strikes in the last hour.`;
             }

            // --- 4. Update Nowcast (Still clear and redraw this derived layer) ---
            nowcastLayer.clearLayers(); // Clear previous nowcast shapes
            let nowcastActive = false;
            const filteredStrikesForNowcast = Object.values(validStrikesById); // Get array of strike data

            if (filteredStrikesForNowcast.length >= NOWCAST_CONF.MIN_CLUSTER_SIZE) {
                try {
                    const nowcastResults = calculateLightningNowcast(filteredStrikesForNowcast, new Date(now), NOWCAST_CONF);
                    if (nowcastResults.length > 0) {
                        renderNowcast2D(nowcastResults); // Renders to nowcastLayer
                        nowcastActive = true;
                    }
                } catch (e) {
                    console.error("Error during nowcast calculation:", e);
                }
            }
            updateLegend(nowcastActive); // Update legend based on nowcast activity
        }

        // --- Helper: Parse ISO Time String (No changes needed) ---
         function parseISOTime(isoString) {
             return new Date(isoString);
         }

         // --- Helper: Get Color from Age Fraction (No changes needed) ---
         function getColorFromAge(fraction) {
             if (fraction < 0.15) return '#ffd700';
             if (fraction < 0.30) return '#ff69b4';
             if (fraction < 0.50) return '#ff00ff';
             if (fraction < 0.75) return '#800080';
             return '#4b0082';
         }


        // --- Nowcasting Logic (No changes needed in the core algorithms) ---
        // calculateLightningNowcast, ransacLinearRegression, fitWeightedLinearModel, calculateRsquared
        // remain the same. They operate on the *data* provided to them.

        // --- Nowcast Rendering (No changes needed, still redraws to nowcastLayer) ---
        // renderNowcast2D remains the same.

        // --- Legend Update (No changes needed) ---
        // updateLegend remains the same.


        // --- Initial Load and Interval ---
        fetchDataAndUpdateMap(); // Initial load
        setInterval(fetchDataAndUpdateMap, REFRESH_INTERVAL_MS); // Set refresh interval


        // --- Helper Functions (Nowcasting - Keep these as they were) ---

        function calculateLightningNowcast(lightningData, referenceTime, config) {
            const refTimeMs = referenceTime.getTime();
            if (!lightningData || lightningData.length < config.MIN_CLUSTER_SIZE) return [];
            const dataForCalc = lightningData.map(s => {
                try {
                    return { coordinates: [s.lon, s.lat], time: parseISOTime(s.time) };
                } catch (e) { return null; }
            }).filter(s => s && s.time && !isNaN(s.time.getTime()));
            if (dataForCalc.length < config.MIN_CLUSTER_SIZE) return [];

            const clusters = []; const usedIndices = new Set();
            const sortedData = dataForCalc.sort((a, b) => a.time - b.time);
            for (let i = 0; i < sortedData.length; i++) {
                if (usedIndices.has(i)) continue;
                const currentCluster = []; const queue = [i]; const clusterIndices = new Set([i]);
                while (queue.length > 0) {
                    const currentIndex = queue.shift(); const currentStrike = sortedData[currentIndex];
                    currentCluster.push(currentStrike); usedIndices.add(currentIndex);
                    for (let j = 0; j < sortedData.length; j++) {
                        if (clusterIndices.has(j)) continue; const potentialNeighbor = sortedData[j];
                        const timeDiff = Math.abs(potentialNeighbor.time.getTime() - currentStrike.time.getTime());
                        if (timeDiff <= config.MAX_TIME_RANGE_MS) {
                            const distKm = turf.distance(turf.point(currentStrike.coordinates), turf.point(potentialNeighbor.coordinates), { units: 'kilometers' });
                            if (distKm <= config.MAX_CLUSTER_DIST_KM) {
                                if (!usedIndices.has(j)) { queue.push(j); } clusterIndices.add(j);
                            } } } }
                if (currentCluster.length >= config.MIN_CLUSTER_SIZE) {
                    const times = currentCluster.map(s => s.time.getTime()); const clusterDuration = Math.max(...times) - Math.min(...times);
                    if (clusterDuration > 60 * 1000) { clusters.push(currentCluster); clusterIndices.forEach(idx => usedIndices.add(idx)); }
                } }

            const clusterInfos = [];
            clusters.forEach((cluster) => {
                const times = cluster.map(s => s.time.getTime()); const minTime = Math.min(...times); const maxTime = Math.max(...times);
                if (refTimeMs - maxTime > config.INACTIVITY_THRESHOLD_MS) return;
                const bins = [];
                for (let t = minTime; t <= maxTime; t += config.TIME_BIN_MS) {
                    const binEnd = t + config.TIME_BIN_MS; const binStrikes = cluster.filter(s => s.time.getTime() >= t && s.time.getTime() < binEnd);
                    if (binStrikes.length > 0) {
                        let sumLat = 0, sumLon = 0, sumWeight = 0; const clusterDuration = maxTime - minTime;
                        binStrikes.forEach(s => { const weight = clusterDuration > 0 ? Math.exp(-config.DECAY_CONSTANT * (maxTime - s.time.getTime()) / clusterDuration) : 1; sumLat += s.coordinates[1] * weight; sumLon += s.coordinates[0] * weight; sumWeight += weight; });
                        if (sumWeight > 0) { bins.push({ time: t + config.TIME_BIN_MS / 2, lat: sumLat / sumWeight, lon: sumLon / sumWeight }); } } }
                if (bins.length === 0) return; bins.sort((a, b) => a.time - b.time);
                let speedKmH = 0, directionDeg = 0, regressionScore = 0; const baseLat = bins[bins.length - 1].lat; const baseLon = bins[bins.length - 1].lon; const latestBinTime = bins[bins.length - 1].time;
                if (bins.length >= config.MIN_BINS_FOR_MOTION) {
                    const model = ransacLinearRegression(bins, config.RANSAC_ITERATIONS, config.RANSAC_THRESHOLD_DEG, latestBinTime);
                    const speedLatDegPerSec = model.slopeLat; const speedLonDegPerSec = model.slopeLon; regressionScore = model.r2;
                    const avgLatRad = (bins.reduce((sum, b) => sum + b.lat, 0) / bins.length) * Math.PI / 180; const latFactor = Math.cos(avgLatRad);
                    const speedLatKmH = speedLatDegPerSec * 111.32 * 3600; const speedLonKmH = speedLonDegPerSec * (111.32 * latFactor) * 3600;
                    speedKmH = Math.min(200, Math.sqrt(speedLatKmH**2 + speedLonKmH**2));
                    if (speedKmH > 0.1) { directionDeg = (Math.atan2(speedLonKmH, speedLatKmH) * 180 / Math.PI + 360) % 360; } }
                const sizeScore = Math.min(1, cluster.length / 50); const durationScore = Math.min(1, (maxTime - minTime) / (30 * 60 * 1000));
                const recencyScore = Math.max(0, 1 - (refTimeMs - maxTime) / config.INACTIVITY_THRESHOLD_MS); const velocityScore = Math.min(1, speedKmH / 100); const fitScore = regressionScore;
                const confidenceScore = Math.max(0.1, sizeScore * 0.25 + durationScore * 0.25 + recencyScore * 0.20 + velocityScore * 0.15 + fitScore * 0.15);
                clusterInfos.push({ baseLat, baseLon, speedKmH, directionDeg, confidenceScore, clusterSize: cluster.length });
            });

            const smoothedClusters = clusterInfos.map((currentCluster, index) => {
                let weightedSpeedSum = 0, weightedSinSum = 0, weightedCosSum = 0, totalWeight = 0;
                const selfWeight = currentCluster.confidenceScore * 2.0; weightedSpeedSum += currentCluster.speedKmH * selfWeight; weightedSinSum += Math.sin(currentCluster.directionDeg * Math.PI/180) * currentCluster.speedKmH * selfWeight; weightedCosSum += Math.cos(currentCluster.directionDeg * Math.PI/180) * currentCluster.speedKmH * selfWeight; totalWeight += selfWeight;
                clusterInfos.forEach((otherCluster, otherIndex) => {
                    if (index === otherIndex) return; const distKm = turf.distance([currentCluster.baseLon, currentCluster.baseLat], [otherCluster.baseLon, otherCluster.baseLat], {units: 'kilometers'});
                    if (distKm < config.SMOOTHING_NEIGHBOR_DIST_KM) {
                        const weight = otherCluster.confidenceScore / (distKm / 50 + 1); weightedSpeedSum += otherCluster.speedKmH * weight; weightedSinSum += Math.sin(otherCluster.directionDeg * Math.PI/180) * otherCluster.speedKmH * weight; weightedCosSum += Math.cos(otherCluster.directionDeg * Math.PI/180) * otherCluster.speedKmH * weight; totalWeight += weight; } });
                let smoothedSpeedKmH = currentCluster.speedKmH; let smoothedDirectionDeg = currentCluster.directionDeg;
                if (totalWeight > 0.01) {
                    const avgSpeedX = weightedSinSum / totalWeight; const avgSpeedY = weightedCosSum / totalWeight; smoothedSpeedKmH = Math.min(200, Math.sqrt(avgSpeedX**2 + avgSpeedY**2));
                    if (smoothedSpeedKmH > 0.1) { smoothedDirectionDeg = (Math.atan2(avgSpeedX, avgSpeedY) * 180 / Math.PI + 360) % 360; } else { smoothedDirectionDeg = currentCluster.directionDeg; smoothedSpeedKmH = 0;} }
                return { ...currentCluster, speedKmH: smoothedSpeedKmH, directionDeg: smoothedDirectionDeg }; });
            return smoothedClusters;
        }

        function ransacLinearRegression(bins, iterations, thresholdDeg, baseTime) {
             let bestModel = { slopeLat: 0, slopeLon: 0, interceptLat: bins[bins.length-1].lat, interceptLon: bins[bins.length-1].lon, r2: 0 }; let maxInliers = 0; const n = bins.length; if (n < 2) return bestModel;
             const refTimeMs = baseTime || bins[n - 1].time;
             for (let i = 0; i < iterations; i++) {
                 let idx1 = Math.floor(Math.random() * n); let idx2 = Math.floor(Math.random() * n); while (idx2 === idx1) idx2 = Math.floor(Math.random() * n); const sample = [bins[idx1], bins[idx2]];
                 const currentModel = fitWeightedLinearModel(sample, refTimeMs, 1.0); const currentInliers = [];
                 bins.forEach(b => { const tSec = (b.time - refTimeMs) / 1000.0; const predLat = currentModel.interceptLat + currentModel.slopeLat * tSec; const predLon = currentModel.interceptLon + currentModel.slopeLon * tSec; const distDeg = Math.sqrt((b.lat - predLat)**2 + (b.lon - predLon)**2); if (distDeg < thresholdDeg) { currentInliers.push(b); } });
                 if (currentInliers.length > maxInliers) { maxInliers = currentInliers.length; if (currentInliers.length >= 2) { bestModel = fitWeightedLinearModel(currentInliers, refTimeMs, NOWCAST_CONF.DECAY_CONSTANT); } else { bestModel = currentModel; } } }
             if (maxInliers >= 2) { bestModel.r2 = calculateRsquared(bins, bestModel, refTimeMs); } else { bestModel.r2 = 0; } return bestModel;
        }

        function fitWeightedLinearModel(points, refTimeMs, decay) {
            let sumT = 0, sumLat = 0, sumLon = 0, sumTLat = 0, sumTLon = 0, sumT2 = 0, sumW = 0; const n = points.length; if (n === 0) return { slopeLat: 0, slopeLon: 0, interceptLat: 0, interceptLon: 0 }; if (n === 1) return { slopeLat: 0, slopeLon: 0, interceptLat: points[0].lat, interceptLon: points[0].lon };
            const times = points.map(p => p.time); const maxTime = Math.max(...times); const minTime = Math.min(...times); const timeSpan = Math.max(1, maxTime - minTime);
            points.forEach(p => { const tSec = (p.time - refTimeMs) / 1000.0; const weight = Math.exp(-decay * (maxTime - p.time) / timeSpan); sumW += weight; sumT += tSec * weight; sumLat += p.lat * weight; sumLon += p.lon * weight; sumTLat += tSec * p.lat * weight; sumTLon += tSec * p.lon * weight; sumT2 += tSec * tSec * weight; });
            if (sumW <= 1e-9) { return { slopeLat: 0, slopeLon: 0, interceptLat: points[n-1].lat, interceptLon: points[n-1].lon }; }
            const denom = sumT2 * sumW - sumT * sumT; let slopeLat = 0, slopeLon = 0, interceptLat = sumLat / sumW, interceptLon = sumLon / sumW;
            if (Math.abs(denom) > 1e-9) { slopeLat = (sumTLat * sumW - sumT * sumLat) / denom; slopeLon = (sumTLon * sumW - sumT * sumLon) / denom; interceptLat = (sumLat - slopeLat * sumT) / sumW; interceptLon = (sumLon - slopeLon * sumT) / sumW; }
            return { slopeLat, slopeLon, interceptLat, interceptLon };
        }

         function calculateRsquared(allPoints, model, refTimeMs) {
             if (allPoints.length < 2) return 0; let ssTotLat = 0, ssResLat = 0, ssTotLon = 0, ssResLon = 0;
             const meanLat = allPoints.reduce((sum, p) => sum + p.lat, 0) / allPoints.length; const meanLon = allPoints.reduce((sum, p) => sum + p.lon, 0) / allPoints.length;
             allPoints.forEach(p => { const tSec = (p.time - refTimeMs) / 1000.0; const predLat = model.interceptLat + model.slopeLat * tSec; const predLon = model.interceptLon + model.slopeLon * tSec; ssTotLat += (p.lat - meanLat)**2; ssResLat += (p.lat - predLat)**2; ssTotLon += (p.lon - meanLon)**2; ssResLon += (p.lon - predLon)**2; });
             const r2Lat = ssTotLat > 1e-9 ? Math.max(0, 1 - ssResLat / ssTotLat) : 1; const r2Lon = ssTotLon > 1e-9 ? Math.max(0, 1 - ssResLon / ssTotLon) : 1; return (r2Lat + r2Lon) / 2.0;
         }

        function renderNowcast2D(nowcasts) {
            // nowcastLayer is already cleared in updateMapDisplay
            nowcasts.forEach((cluster, index) => {
                const confidenceColor = cluster.confidenceScore > 0.75 ? '#ff0000' : cluster.confidenceScore > 0.50 ? '#ffa500' : '#ffdd00';
                const baseRadiusKm = 5; const confidenceRadiusFactor = 15; const radiusKm = baseRadiusKm + (cluster.confidenceScore * confidenceRadiusFactor);
                L.circle([cluster.baseLat, cluster.baseLon], { radius: radiusKm * 1000, color: confidenceColor, fillColor: confidenceColor, fillOpacity: 0.35, weight: 2, className: 'nowcast-cluster'
                }).bindPopup(`<b>Nowcast Cluster ${index + 1}</b><br>Strikes: ${cluster.clusterSize}<br>Confidence: ${(cluster.confidenceScore * 100).toFixed(0)}%<br>Speed: ${cluster.speedKmH.toFixed(0)} km/h @ ${cluster.directionDeg.toFixed(0)}°`)
                  .addTo(nowcastLayer);
                if (cluster.speedKmH > 5) {
                    const coneDistanceKm = Math.max(10, cluster.speedKmH * 0.5); const coneWidthDegrees = 30 + (1.0 - cluster.confidenceScore) * 30;
                    try {
                         const bearing1 = cluster.directionDeg - (coneWidthDegrees / 2); const bearing2 = cluster.directionDeg + (coneWidthDegrees / 2);
                         const cone = turf.sector([cluster.baseLon, cluster.baseLat], coneDistanceKm, bearing1, bearing2, { units: 'kilometers' });
                         L.geoJSON(cone, { style: { color: confidenceColor, fillColor: confidenceColor, fillOpacity: 0.2, weight: 1, dashArray: '5, 5', className: 'nowcast-cone' } }).addTo(nowcastLayer);
                    } catch (e) { console.error("Error creating Turf sector:", e); const endPoint = turf.destination([cluster.baseLon, cluster.baseLat], coneDistanceKm, cluster.directionDeg, {units: 'kilometers'}); L.polyline([[cluster.baseLat, cluster.baseLon], [endPoint.geometry.coordinates[1], endPoint.geometry.coordinates[0]]], { color: confidenceColor, weight: 2, dashArray: '5, 5', opacity: 0.5 }).addTo(nowcastLayer); }
                } });
        }

         function updateLegend(nowcastActive) {
             let content = '<h4>Legend</h4>';
             content += '<div><div class="color-box" style="background: #ffd700"></div>~0-9 min ago</div>'; content += '<div><div class="color-box" style="background: #ff69b4"></div>~9-18 min ago</div>'; content += '<div><div class="color-box" style="background: #ff00ff"></div>~18-30 min ago</div>'; content += '<div><div class="color-box" style="background: #800080"></div>~30-45 min ago</div>'; content += '<div><div class="color-box" style="background: #4b0082"></div>~45-60 min ago</div>';
             if (nowcastActive) { content += '<h4 style="margin-top: 8px;">Nowcast Confidence</h4>'; content += '<div><div class="color-box" style="background: #ff0000"></div>High (>75%)</div>'; content += '<div><div class="color-box" style="background: #ffa500"></div>Moderate (50-75%)</div>'; content += '<div><div class="color-box" style="background: #ffdd00"></div>Low (<50%)</div>'; content += '<div style="margin-top:3px; color: #555">(Circle: Current Area | Cone: 30min Forecast)</div>'; }
             legendElement.innerHTML = content; legendElement.style.display = 'block';
         }

    </script>
</body>
